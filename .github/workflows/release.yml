name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.5'

      # Static: the binary runs on Flatcar, which need not match the
      # builder's glibc.
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux make build

      - uses: actions/upload-artifact@v4
        with:
          name: containerd-driver
          path: containerd-driver

      - name: Attach binary to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: containerd-driver
